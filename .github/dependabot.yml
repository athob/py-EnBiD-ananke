# Dependabot opens a pull request when an action the workflows use has a new
# release. https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Updates are proposed against `develop`, like any other change: CI runs on
# them, and once one is merged and green CI moves `stable` forward by itself.
# Without `target-branch` Dependabot would target `main`. (Its *security*
# updates go to the default branch whatever is set here: merge those into
# `develop` as well, or let the next release carry them.)

version: 2
updates:
  # The actions are pinned by commit SHA with the version in a trailing comment
  # (`uses: actions/checkout@3d3c... # v7.0.1`). Dependabot understands that
  # form and updates the SHA and the comment together. Worth a look each time:
  # a major bump can change behavior. One grouped pull request a week.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # The tools the CI and CD workflows install are locked, with hashes, in
  # .github/requirements/: update.sh writes each requirements-X.txt from the
  # requirements-X.in next to it, with `uv pip compile --universal --generate-hashes
  # --python-version N`, and the lock records that command in its header.
  #
  # The ecosystem has to be uv, not pip. The pip ecosystem regenerates a compiled lock with
  # pip-tools' pip-compile, which knows neither --universal nor --python-version: it resolves
  # for its own Python on its own platform, and drops what the other Pythons need (that is
  # what broke the test lock, and why only 3.8, 3.9 and 3.10 failed). The uv ecosystem runs
  # the `uv pip compile` command recorded in the lock again, options included.
  #
  # Dependabot takes one version of each package as "the current one", and checks that the newest
  # can be pinned for every Python the lock covers. A lock that holds several versions of a
  # package, one per Python, therefore cannot be maintained by it (it reported pytest, coverage and
  # pluggy as errors): the Pythons past their end of life have their lock in
  # .github/requirements-frozen/, next to this directory and not in it (Dependabot also fetches
  # the subfolders of its directory), which is
  # not a directory it looks at, and requirements-test.txt only covers the supported ones.
  #
  # `allow: all`, because most of what the locks hold (coverage, pluggy, the Sphinx stack...)
  # is not named in a .in file, and Dependabot proposes nothing for those by default.
  #
  # Known problem: GitHub refuses to open the pull requests (HTTP 400, reported as
  # dependency_file_not_supported), whatever there is to update; see
  # https://github.com/athob/py-EnBiD-ananke/issues/12. Until that changes the locks are
  # refreshed by hand with update.sh --upgrade.
  - package-ecosystem: uv
    directory: /.github/requirements
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    ignore:
      # docutils 0.23 cannot be locked: every myst-parser release caps docutils below 0.23 (the
      # docs lock). uv rightly refuses to resolve it, but Dependabot reports that as an error and
      # fails its whole run, every week. Remove this once a myst-parser release allows 0.23.
      - dependency-name: docutils
        versions: [">=0.23"]
      # Sphinx 9.2 needs Python 3.13, and the docs lock is compiled for 3.12 and up (the docs job of
      # ci.yml runs on 3.12): uv rightly refuses to lock it, and Dependabot reports that as an error
      # ("unknown_error", with "requires Python >=3.13" in the log). update.sh does not read this
      # ignore, so the same limit is in requirements-docs.in. Remove both when the docs lock is compiled
      # for Python 3.13 or later: test_the_limits_on_sphinx_9_2_match_the_python_of_the_docs_lock
      # fails then, to say so.
      - dependency-name: sphinx
        versions: [">=9.2"]
    groups:
      ci-tools:
        patterns: ["*"]
