# The settings of the second run of mypy, on the tools that build EnBiD (src/_build_utils.py). The first, with
# the settings of pyproject.toml, is on the package. setup.py imports these tools as `src._build_utils`, and
# their relative imports go through the links in src/ to the modules of the package: they cannot be named like
# the package is in pyproject.toml (from src/), or those imports would not be found.
#
#   mypy --config-file .github/mypy-build.ini src/_build_utils.py
[mypy]
# the errors of what these tools import (versioneer, the linked modules) are not theirs: the package is checked
# by the first run
follow_imports = silent
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# From Python 3.12, distutils is not in the standard library any more (setuptools provides it, which mypy does
# not see), and Python 3.8 to 3.11 have it.
[mypy-distutils.*]
ignore_missing_imports = True
