[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# The GitHub editor is 127 characters wide.
line-length = 127
extend-exclude = [
    "*.ipynb",
    # Generated by versioneer: leave as generated.
    "versioneer.py",
    "src/enbid_ananke/_version.py",
]

[tool.ruff.lint]
# What fails CI: syntax errors and undefined names (the selection flake8 had).
# CI also prints a broader report, for information only (see ci.yml).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["src/enbid_ananke"]
omit = [
    # Generated by versioneer.
    "*/_version.py",
]

[tool.coverage.report]
# The footer of the modules of the package, `if __name__ == '__main__': raise NotImplementedError()`, is never
# run by a test: it is not counted against the coverage.
exclude_also = [
    "if __name__ == .__main__.:",
]
# The floor of the coverage, by lines and branches, on the Python 3.12 run of CI. When the coverage rises, raise
# it; a change that lowers it needs a test, not a lower floor.
fail_under = 95
